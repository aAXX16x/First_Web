<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Hola Mundo</title>

    <style>
        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        h1 {
            color: #38bdf8;
            font-size: 60px;
            background-color: #020617;
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px #38bdf8;
            transition: all 0.3s ease;
            /* animación smooth */
            cursor: pointer;
        }
        /* 👇 EFECTO HOVER */
        
        h1:hover {
            background-color: #7dd3fc;
            /* azul celeste */
            color: #000000;
            /* negro */
            box-shadow: 0 0 25px #7dd3fc;
        }
    </style>

    </style>
</head>

<body>

    <h1>Hola Mundo :D</h1>

</body>

</html>
